<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONCAT</title>
</head>
<body>
   
    <p id="text">czuwaj</p>
    
    
    <button id="btn1" onclick="dodaj()">Dodaj wykrzyknik</button>

    <script>
        
        
        
        function dodaj(){
            const p = document.getElementById('text');
            p.textContent = p.textContent.concat('!');
        }
   
   </script>
</body>
</html>
