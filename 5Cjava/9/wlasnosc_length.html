<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>length</title>
</head>

<body>
    <fieldset><legend>Właściwość length</legend>
    <p id="par1">Jan Chryzostom Pasek z Gosławic herbu Doliwa</p>
    <p id="par2" ></p>
    <button onclick="ilosc()">Policz znaki</button>

    <script>
        function ilosc() {
            const par = document.getElementById('par1').textContent;
            const ilosc = par.length;
            const wynik = document.getElementById('par2');
           
           
           
            wynik.textContent = "Tekst powyżej ma długość " + ilosc + " znaki.";
            wynik.style.backgroundColor = "#ffdfd3";
            wynik.style.padding = "5px";
        }
    </script>
    </fieldset>
</body>
</html>
