         h1 {

        border-bottom: 2px solid rgb(2, 2, 68);

<body>
 <button onclick="pokazWyniki()">Podaj liczbe</button>

  <h1>Wprowadzone: (<span id="liczba"></span>)</h1>

  <p>ceil(<span id="liczba"></span>): <span id="ceil"></span></p>
