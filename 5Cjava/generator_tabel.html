<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Generator tabel HTML</title>
<style>
    div {
padding: 10px;
border: 4px double red;
display: inline-block;
}
table {
  border-collapse: collapse;
  margin-top: 10px;
}
input[type="number"] {
  width: 100px;
}
td {
  border: 1px solid red;
  text-align: center;
  padding: 5px;
  white-space: nowrap;
}
h1 {
  text-decoration: underline wavy red;
}
</style>
</head>
<body>
<h1><i>Generator tabel HTML</i></h1>
<div>
  <label for="wiersze">Liczba wierszy:</label>
  <input type="number" id="wiersze" min="0" max="500">
  <label for="kolumny">Liczba kolumn:</label>
  <input type="number" id="kolumny" min="0" max="500">
  <button id="generuj"><i>Generuj</i></button>
</div>
<table id="tabela"></table>
<script src="generator_tabel.js"></script>
</body>
</html>
