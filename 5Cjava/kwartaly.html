<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kwartaly</title>
    <style>
        html,body{
            height:100%;
            margin:0;
            width: 100%;
        }
        body{
            width: 100%;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#fff;
            font-family: Arial, sans-serif;
        }
        .wrap{
            width:90%;
            max-width:600px;
        }
        #miesiac {
            font-style: italic;
            font-size:30px;
            font-weight:700;
            text-align:center;
            background:#c6b6f0;
            padding:10px;
            margin:0 0 10px 0;
            border-top:4px dashed navy;
            border-bottom:4px dashed navy;
            box-sizing:border-box;
        }
        #refresh {
            width:100%;
            display:block;
            background:#e1cffc;
            padding:10px;
            font-style: italic;
            font-size:30px;
            font-weight:700;
            text-align:center;
            margin:0;
            border-left:none;
            border-right:none;
            border-top:4px dashed navy;
            border-bottom:4px dashed navy;
            cursor:pointer;
            box-sizing:border-box;
        }
        #kwartal {
            width: 100%;
            font-style: italic;
            font-size:30px;
            font-weight:700;
            text-align:center;
            background:#f4e8ff;
            padding:10px;
            margin: 10px 0 10px 0;
            border-top:4px dashed navy;
            border-bottom:4px dashed navy;
            box-sizing:border-box;

        }
    </style>
</head>
<body>
    <div class="wrap">
        <p id="miesiac"></p>
        <button id="refresh" onclick="location.reload()">Odśwież strone</button>
        <p id="kwartal"></p>
    </div>

<script src="kwartaly.js"></script>
</body>
</html>
